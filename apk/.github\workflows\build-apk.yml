name: Build Universal Android APK (All Screens & Versions)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Web Repository Files to Android Assets
        run: |
          mkdir -p apk/app/src/main/assets
          for f in index.html style.css script.js qcf-data.js sw.js manifest.json icon.png icon.svg README.md; do
            if [ -f "$f" ]; then
              cp -f "$f" apk/app/src/main/assets/
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Universal Release APK
        run: |
          gradle assembleRelease --no-daemon
          cp apk/app/build/outputs/apk/release/app-release.apk Quran-Player-Universal.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Player-Universal-APK
          path: Quran-Player-Universal.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v3.0-universal
          name: "المصحف المرتل — تطبيق أندرويد الشامل (Quran-Player.apk)"
          body: "نسخة شاملة جاهزة للتثبيت على جميع الجوالات والأجهزة اللوحية والشاشات الذكية (Android 5.0 إلى Android 16+)."
          files: Quran-Player-Universal.apk
          overwrite: true
