name: Build Universal Android APK & Publish Release

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate or Auto-Extract Android Project & Sync Web Files
        run: |
          FOUND_GRADLE=$(find . -maxdepth 4 -name "settings.gradle" | head -n 1)
          if [ -n "$FOUND_GRADLE" ]; then
            TARGET_DIR=$(dirname "$FOUND_GRADLE")
            echo "Found Android project at: $TARGET_DIR"
          else
            ZIP_FILE=$(find . -maxdepth 3 \( -name "*Android*.zip" -o -name "*Project*.zip" \) | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting Android project from $ZIP_FILE"
              mkdir -p apk_build_project
              unzip -o "$ZIP_FILE" -d apk_build_project
              SUB_GRADLE=$(find apk_build_project -maxdepth 3 -name "settings.gradle" | head -n 1)
              TARGET_DIR=$(dirname "$SUB_GRADLE")
            else
              echo "Error: Could not find settings.gradle or project zip"
              exit 1
            fi
          fi

          echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV
          mkdir -p "$TARGET_DIR/app/src/main/assets"
          for f in index.html style.css script.js qcf-data.js sw.js manifest.json icon.png icon.svg README.md; do
            if [ -f "$f" ]; then
              cp -f "$f" "$TARGET_DIR/app/src/main/assets/"
            fi
          done

          # Fix duplicate class kotlin-stdlib-jdk7 / jdk8 conflict automatically in app/build.gradle
          if [ -f "$TARGET_DIR/app/build.gradle" ] && ! grep -q "kotlin-stdlib-jdk8" "$TARGET_DIR/app/build.gradle"; then
            cat << 'EOF' >> "$TARGET_DIR/app/build.gradle"

          configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Pre-installed Android SDK Licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Universal Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleRelease --no-daemon
          APK_OUT=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK_OUT" "$GITHUB_WORKSPACE/Quran-Player-Universal.apk"
          mkdir -p "$GITHUB_WORKSPACE/apk"
          cp "$APK_OUT" "$GITHUB_WORKSPACE/apk/Quran-Player-Universal.apk"

      - name: Upload APK Artifact (Always Available in Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Player-Universal-APK
          path: Quran-Player-Universal.apk

      - name: Commit Built APK to apk/ Folder in Repository
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/Quran-Player-Universal.apk
          git diff --staged --quiet || git commit -m "chore: update compiled Quran-Player-Universal.apk [skip ci]"
          git push

      - name: Create or Update GitHub Release via GH CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.0-universal"
          TITLE="المصحف المرتل — تطبيق أندرويد الشامل (Quran-Player.apk)"
          NOTES="نسخة شاملة جاهزة للتثبيت على جميع الجوالات والأجهزة اللوحية والشاشات الذكية (Android 5.0 إلى Android 16+)."
          git tag -f "$TAG"
          git push origin "$TAG" --force
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Quran-Player-Universal.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" Quran-Player-Universal.apk --title "$TITLE" --notes "$NOTES"
          fi
