name: Build Pure Native Android APK & Publish Release

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate or Auto-Extract Native Android Project
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -name "*Native*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting Native Android project from $ZIP_FILE into apk/"
            rm -rf apk/app apk/build.gradle apk/settings.gradle
            mkdir -p apk
            unzip -o "$ZIP_FILE" -d apk
          fi

          FOUND_GRADLE=$(find . -maxdepth 4 -name "settings.gradle" | head -n 1)
          if [ -n "$FOUND_GRADLE" ]; then
            TARGET_DIR=$(dirname "$FOUND_GRADLE")
            echo "Found Native Android project at: $TARGET_DIR"
          else
            echo "Error: Could not find settings.gradle"
            exit 1
          fi

          echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV

          # If root qcf-data.js exists, convert it into pure JSON asset qcf_data.json automatically
          if [ -f "qcf-data.js" ]; then
            mkdir -p "$TARGET_DIR/app/src/main/assets"
            python3 -c '
          import json
          raw = open("qcf-data.js", "r", encoding="utf-8").read()
          js = raw.split("window.QCF_DATA = ", 1)[1].strip()
          if js.endswith(";"): js = js[:-1]
          obj = json.loads(js)
          with open("'"$TARGET_DIR"'/app/src/main/assets/qcf_data.json", "w", encoding="utf-8") as f:
              json.dump(obj, f, ensure_ascii=False, separators=(",", ":"))
          '
          fi

          # Remove any legacy WebView HTML/CSS/JS assets if present so APK is 100% pure Native Java
          rm -f "$TARGET_DIR/app/src/main/assets/index.html"                 "$TARGET_DIR/app/src/main/assets/style.css"                 "$TARGET_DIR/app/src/main/assets/script.js"                 "$TARGET_DIR/app/src/main/assets/sw.js"                 "$TARGET_DIR/app/src/main/assets/qcf-data.js"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Pre-installed Android SDK Licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Pure Native Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleRelease --no-daemon
          APK_OUT=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK_OUT" "$GITHUB_WORKSPACE/Quran-Player-Universal.apk"
          mkdir -p "$GITHUB_WORKSPACE/apk"
          cp "$APK_OUT" "$GITHUB_WORKSPACE/apk/Quran-Player-Universal.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Player-Native-APK
          path: Quran-Player-Universal.apk

      - name: Commit Built Native APK to apk/ Folder
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/Quran-Player-Universal.apk
          git diff --staged --quiet || git commit -m "chore: update pure native Quran-Player-Universal.apk [skip ci]"
          git push

      - name: Create or Update GitHub Release via GH CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.1-native"
          TITLE="المصحف المرتل — تطبيق أندرويد أصلي بالكامل (Pure Native APK)"
          NOTES="تطبيق أندرويد أصلي 100% (Java Native UI & MediaPlayer) بدون WebView أو HTML، متوافق مع جميع الجوالات والأجهزة اللوحية والشاشات (Android 5.0 إلى Android 16+)."
          git tag -f "$TAG"
          git push origin "$TAG" --force
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Quran-Player-Universal.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" Quran-Player-Universal.apk --title "$TITLE" --notes "$NOTES"
          fi
