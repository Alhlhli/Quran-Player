name: Build Universal Android APK (From apk/ Folder)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android Project & Sync Latest Web Files
        run: |
          if [ -f "apk/settings.gradle" ]; then
            echo "PROJECT_DIR=apk" >> $GITHUB_ENV
            TARGET_DIR="apk"
          elif [ -f "apk/QuranPlayer/settings.gradle" ]; then
            echo "PROJECT_DIR=apk/QuranPlayer" >> $GITHUB_ENV
            TARGET_DIR="apk/QuranPlayer"
          elif [ -f "settings.gradle" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
            TARGET_DIR="."
          else
            # In case a zip file was uploaded inside apk/
            ZIP_FILE=$(find apk -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o "$ZIP_FILE" -d apk/extracted
              echo "PROJECT_DIR=apk/extracted" >> $GITHUB_ENV
              TARGET_DIR="apk/extracted"
            else
              echo "Error: Could not find settings.gradle in apk/"
              exit 1
            fi
          fi

          mkdir -p "$TARGET_DIR/app/src/main/assets"
          for f in index.html style.css script.js qcf-data.js sw.js manifest.json icon.png icon.svg README.md; do
            if [ -f "$f" ]; then
              cp -f "$f" "$TARGET_DIR/app/src/main/assets/"
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Universal Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Quran-Player-Universal.apk"
          mkdir -p "$GITHUB_WORKSPACE/apk"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/apk/Quran-Player-Universal.apk"

      - name: Commit Built APK to apk/ Folder in Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Quran-Player-Universal.apk
          git diff --staged --quiet || git commit -m "chore: update compiled Quran-Player-Universal.apk [skip ci]"
          git push || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Player-Universal-APK
          path: Quran-Player-Universal.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v3.0-universal
          name: "المصحف المرتل — تطبيق أندرويد الشامل (Quran-Player.apk)"
          body: "نسخة شاملة جاهزة للتثبيت على جميع الجوالات والأجهزة اللوحية والشاشات الذكية (Android 5.0 إلى Android 16+)."
          files: Quran-Player-Universal.apk
          overwrite: true
